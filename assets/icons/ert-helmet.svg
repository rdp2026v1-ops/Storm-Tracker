<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <defs>
    <linearGradient id="helmetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="brimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="redCrossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Helmet Dome Shell -->
  <path d="M 8 30 C 7 19, 13 8, 24 8 C 35 8, 41 19, 40 30 C 42 30.5, 44 32, 44 34 C 44 36.5, 41.5 37.5, 38 37.5 L 10 37.5 C 6.5 37.5, 4 36.5, 4 34 C 4 32, 6 30.5, 8 30 Z"
        fill="url(#helmetGrad)" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" filter="url(#shadow)" />

  <!-- Hard Hat Structural Top Ridge -->
  <path d="M 24 8 L 24 16" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 23 8.5 L 23 16" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />

  <!-- Hard Hat Brim Lower Rim -->
  <path d="M 5 34 C 11 36.5, 37 36.5, 43 34" stroke="url(#brimGrad)" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- High-Visibility Red Cross on Front of White Helmet -->
  <g filter="drop-shadow(0px 1px 1px rgba(0,0,0,0.25))">
    <rect x="21" y="17" width="6" height="15" rx="1.2" fill="url(#redCrossGrad)" stroke="#B91C1C" stroke-width="0.5" />
    <rect x="16.5" y="21.5" width="15" height="6" rx="1.2" fill="url(#redCrossGrad)" stroke="#B91C1C" stroke-width="0.5" />
  </g>
</svg>
